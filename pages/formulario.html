<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101010">

    <title>Inscrição - Prisma Cursos</title>

    <style>
        /* =========================================
           VARIÁVEIS GERAIS
        ========================================= */

        :root {
            --bg-dark: #101010;
            --card-bg: #d9d9d9;
            --darker-red: #3b0000;
            --text-dark: #1a1a1a;
            --text-light: #ffffff;
            --focus-outline: #006fc9;
            --cyan: #13AEF9;
            --glow-white: 0 0 15px rgba(255, 255, 255, 0.65);
            --glow-blue: 0 0 22px rgba(0, 150, 255, 0.75);

            /* Cor padrão: Desenvolvimento Fullstack */
            --course-color: #900003;
            --course-text: #ffffff;
        }

        /* =========================================
           CORES DOS SEIS CURSOS
        ========================================= */

        /* Desenvolvimento Fullstack */
        body[data-course="fullstack"] {
            --course-color: #900003;
            --course-text: #ffffff;
        }

        /* Gestão Ágil de Projetos */
        body[data-course="gestao-agil"] {
            --course-color: #009C49;
            --course-text: #1a1a1a;
        }

        /* Administração de Negócios */
        body[data-course="administracao"] {
            --course-color: #644792;
            --course-text: #ffffff;
        }

        /* Data Analytics */
        body[data-course="data-analytics"] {
            --course-color: #F18D1A;
            --course-text: #1a1a1a;
        }

        /* UX/UI Design */
        body[data-course="ux-ui"] {
            --course-color: #C5BE00;
            --course-text: #1a1a1a;
        }

        /* Design Gráfico */
        body[data-course="design-grafico"] {
            --course-color: #0050A1;
            --course-text: #ffffff;
        }

        /* CONFIGURAÇÕES GERAIS */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            min-width: 280px;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-dark);
            color: var(--text-dark);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .hidden {
            display: none !important;
        }

        /* CARTÃO PRINCIPAL */

        .registration-card {
            width: 100%;
            max-width: 330px;
            padding: 1.25rem 2rem;
            border-radius: 22px;
            background-color: var(--card-bg);
            box-shadow: var(--glow-white);
            text-align: center;
            transition: box-shadow 0.3s ease;
        }

        .registration-card.success-glow {
            box-shadow: var(--glow-blue);
        }

        /* CABEÇALHO */

        .card-header h1 {
            margin: 0 0 0.75rem;
            color: var(--text-dark);
            font-size: 0.9rem;
            font-weight: 700;
            line-height: 1.25;
        }

        /* CAMPOS DO FORMULÁRIO */

        .form-group {
            position: relative;
            margin-bottom: 0.5rem;
        }

        .form-control {
            display: block;
            width: 100%;
            height: 32px;
            padding: 0.35rem 0.7rem;
            border: 1px solid transparent;
            border-radius: 999px;
            background-color: var(--text-light);
            color: var(--text-dark);
            font: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            text-align: center;
        }

        .form-control::placeholder {
            color: #454545;
            opacity: 1;
        }

        .form-control:focus-visible,
        .btn:focus-visible {
            outline: 3px solid var(--focus-outline);
            outline-offset: 2px;
        }

        .form-control[aria-invalid="true"] {
            border-color: var(--cyan);
        }

        /* BOTÕES */

        .btn {
            border: 0;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            transition:
                transform 0.1s ease,
                background-color 0.2s ease,
                filter 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Botão de inscrição: cor definida pelo curso */

        .btn-submit {
            width: 100%;
            margin-top: 0.25rem;
            padding: 0.45rem 0.6rem;
            border-radius: 999px;
            background-color: var(--course-color);
            color: var(--course-text);
            font-size: 0.875rem;
        }

        .btn-submit:hover {
            filter: brightness(0.88);
        }

        /* MENSAGENS DE VALIDAÇÃO */

        .validation-message {
            position: absolute;
            z-index: 20;
            top: calc(100% + 6px);
            left: 8px;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            width: max-content;
            max-width: min(320px, calc(100vw - 7rem));
            padding: 0.5rem 0.65rem;
            border: 1px solid #bdbdbd;
            border-radius: 4px;
            background: #ffffff;
            color: #252525;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
            font-size: 0.875rem;
            font-weight: 400;
            line-height: 1.3;
            text-align: left;
        }

        .validation-message.hidden {
            display: none !important;
        }

        .validation-message::before {
            content: "";
            position: absolute;
            top: -7px;
            left: 20px;
            width: 12px;
            height: 12px;
            background: #ffffff;
            border-top: 1px solid #bdbdbd;
            border-left: 1px solid #bdbdbd;
            transform: rotate(45deg);
        }

        .validation-icon {
            position: relative;
            z-index: 1;
            flex: 0 0 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 2px;
            background-color: #13AEF9;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: 800;
            line-height: 1;
        }

        .validation-text {
            overflow-wrap: anywhere;
        }

        /* TELA DE CONFIRMAÇÃO */

        .success-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            border-radius: 16px;
            background-color: var(--course-color);
            color: var(--course-text);
        }

        .success-section h2 {
            margin: 0 0 0.6rem;
            font-size: 1rem;
            line-height: 1.25;
        }

        .success-section p {
            margin: 0;
            font-size: 0.875rem;
            line-height: 1.3;
        }

        /* Botão Voltar*/

        .btn-back {
            margin-top: 0.75rem;
            padding: 0.25rem 1.1rem;
            border-radius: 6px;
            background-color: var(--darker-red);
            color: var(--text-light);
            font-size: 0.8rem;
        }

        .btn-back:hover {
            background-color: #260000;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 380px) {
            .registration-card {
                padding-right: 1.5rem;
                padding-left: 1.5rem;
            }

            .validation-message {
                max-width: calc(100vw - 5rem);
            }
        }

        /* Respeita a preferência por menos movimento */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body data-course="fullstack">

    <main>
        <section
            class="registration-card"
            id="regCard"
            aria-labelledby="formTitle"
        >

            <header class="card-header">
                <h1 id="formTitle">
                    Faça sua inscrição para o curso
                </h1>
            </header>

            <form id="registrationForm" novalidate>

                <!-- Nome -->

                <div class="form-group">
                    <label for="userName" class="sr-only">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="userName"
                        name="nome"
                        class="form-control"
                        placeholder="Nome"
                        autocomplete="name"
                        maxlength="150"
                        aria-describedby="nameError"
                        required
                    >

                    <div
                        id="nameError"
                        class="validation-message hidden"
                        role="alert"
                        aria-live="assertive"
                    >
                        <span class="validation-icon" aria-hidden="true">!</span>
                        <span class="validation-text"></span>
                    </div>
                </div>

                <!-- Telefone -->

                <div class="form-group">
                    <label for="userPhone" class="sr-only">
                        Celular com DDD
                    </label>

                    <input
                        type="tel"
                        id="userPhone"
                        name="telefone"
                        class="form-control"
                        placeholder="Telefone"
                        autocomplete="tel"
                        inputmode="numeric"
                        maxlength="15"
                        aria-describedby="phoneError"
                        required
                    >

                    <div
                        id="phoneError"
                        class="validation-message hidden"
                        role="alert"
                        aria-live="assertive"
                    >
                        <span class="validation-icon" aria-hidden="true">!</span>
                        <span class="validation-text"></span>
                    </div>
                </div>

                <!-- E-mail -->

                <div class="form-group">
                    <label for="userEmail" class="sr-only">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="userEmail"
                        name="email"
                        class="form-control"
                        placeholder="E-mail"
                        autocomplete="email"
                        maxlength="254"
                        aria-describedby="emailError"
                        required
                    >

                    <div
                        id="emailError"
                        class="validation-message hidden"
                        role="alert"
                        aria-live="assertive"
                    >
                        <span class="validation-icon" aria-hidden="true">!</span>
                        <span class="validation-text"></span>
                    </div>
                </div>

                <!-- Cupom opcional -->

                <div class="form-group">
                    <label for="userCoupon" class="sr-only">
                        Cupom de desconto (opcional)
                    </label>

                    <input
                        type="text"
                        id="userCoupon"
                        name="cupom"
                        class="form-control"
                        placeholder="Cupom"
                        autocomplete="off"
                        autocapitalize="characters"
                        spellcheck="false"
                        maxlength="50"
                        aria-describedby="couponError"
                    >

                    <div
                        id="couponError"
                        class="validation-message hidden"
                        role="alert"
                        aria-live="assertive"
                    >
                        <span class="validation-icon" aria-hidden="true">!</span>
                        <span class="validation-text"></span>
                    </div>
                </div>

                <button type="submit" class="btn btn-submit">
                    Inscreva-se
                </button>

            </form>

            <!-- Estado de confirmação -->

            <section
                id="successState"
                class="success-section hidden"
                aria-hidden="true"
                aria-labelledby="successTitle"
            >
                <h2 id="successTitle">
                    Inscrição confirmada!
                </h2>

                <!-- ID adicionado aqui para permitir a alteração via JavaScript -->
                <p id="successMessageText">
                    Fique de olho na sua caixa de entrada, acabamos de enviar
                    as informações para o e-mail cadastrado.
                </p>

                <p
                    id="successStatus"
                    class="sr-only"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                ></p>

                <button
                    type="button"
                    class="btn btn-back"
                    id="btnBack"
                >
                    Voltar
                </button>

            </section>

        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            /* Referências aos campos */

            const nameInput = document.getElementById('userName');
            const phoneInput = document.getElementById('userPhone');
            const emailInput = document.getElementById('userEmail');
            const couponInput = document.getElementById('userCoupon');

            const errorElements = {
                userName: document.getElementById('nameError'),
                userPhone: document.getElementById('phoneError'),
                userEmail: document.getElementById('emailError'),
                userCoupon: document.getElementById('couponError')
            };

            const form = document.getElementById('registrationForm');
            const successState = document.getElementById('successState');
            const successStatus = document.getElementById('successStatus');
            const successMessageText = document.getElementById('successMessageText'); // Nova referência
            const regCard = document.getElementById('regCard');
            const btnBack = document.getElementById('btnBack');

            let submitAttempted = false;

            /* Lista de cupons atualizada */
            const validCoupons = new Set([
                'PRISMATECH',
                'DESIGNPRISMA',
                'GETSPRISMA',
                'PRISMATICO'
            ]);

            /* Mostra ou oculta o aviso personalizado de um campo. */

            const setFieldError = (input, message = '') => {
                const errorElement = errorElements[input.id];
                const textElement =
                    errorElement.querySelector('.validation-text');

                textElement.textContent = message;
                errorElement.classList.toggle('hidden', message === '');

                if (message) {
                    input.setAttribute('aria-invalid', 'true');
                } else {
                    input.removeAttribute('aria-invalid');
                }
            };

            /* Limpa todos os avisos. */

            const clearAllErrors = () => {
                [
                    nameInput,
                    phoneInput,
                    emailInput,
                    couponInput
                ].forEach((input) => {
                    setFieldError(input, '');
                });
            };

            /* Máscara de telefone: (99) 99999-9999. */

            phoneInput.addEventListener('input', (event) => {
                const digits = event.target.value
                    .replace(/\D/g, '')
                    .slice(0, 11);

                let formatted = '';

                if (digits.length === 1) {
                    formatted = `(${digits}`;
                } else if (digits.length === 2) {
                    formatted = `(${digits})`;
                } else if (digits.length > 2) {
                    const ddd = digits.slice(0, 2);
                    const number = digits.slice(2);

                    formatted = number.length <= 5
                        ? `(${ddd}) ${number}`
                        : `(${ddd}) ${number.slice(0, 5)}-${number.slice(5)}`;
                }

                event.target.value = formatted;

                if (
                    submitAttempted &&
                    !errorElements.userPhone.classList.contains('hidden')
                ) {
                    validateSingleField(phoneInput);
                }
            });

            /* Converte automaticamente o cupom para letras maiúsculas. */

            couponInput.addEventListener('input', () => {
                const start = couponInput.selectionStart;
                const end = couponInput.selectionEnd;

                couponInput.value = couponInput.value.toUpperCase();

                if (start !== null && end !== null) {
                    couponInput.setSelectionRange(start, end);
                }

                if (
                    submitAttempted &&
                    !errorElements.userCoupon.classList.contains('hidden')
                ) {
                    validateSingleField(couponInput);
                }
            });

            couponInput.addEventListener('blur', () => {
                couponInput.value = couponInput.value.trim().toUpperCase();

                if (
                    submitAttempted &&
                    !errorElements.userCoupon.classList.contains('hidden')
                ) {
                    validateSingleField(couponInput);
                }
            });

            /* Define a mensagem de erro para cada campo. */

            const getValidationMessage = (input) => {
                const value = input.value.trim();

                if (input === nameInput) {
                    return value ? '' : 'Preencha este campo.';
                }

                if (input === phoneInput) {
                    if (!value) {
                        return 'Preencha este campo.';
                    }

                    if (!/^\([0-9]{2}\) 9[0-9]{4}-[0-9]{4}$/.test(value)) {
                        return 'Digite um celular válido com DDD.';
                    }

                    return '';
                }

                if (input === emailInput) {
                    if (!value) {
                        return 'Preencha este campo.';
                    }

                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
                        return 'Informe um endereço de e-mail válido.';
                    }

                    return '';
                }

                if (input === couponInput) {
                    if (!value) {
                        return '';
                    }

                    return validCoupons.has(value.toUpperCase())
                        ? ''
                        : 'Este código de cupom não existe.';
                }

                return '';
            };

            /* Valida um campo e apresenta o aviso quando necessário. */

            const validateSingleField = (input) => {
                const message = getValidationMessage(input);
                setFieldError(input, message);
                return message === '';
            };

            /* Atualiza os erros de nome e e-mail quando o usuário digita. */

            [nameInput, emailInput].forEach((input) => {
                input.addEventListener('input', () => {
                    if (
                        submitAttempted &&
                        !errorElements[input.id].classList.contains('hidden')
                    ) {
                        validateSingleField(input);
                    }
                });
            });

            /* Atualiza o aviso ao sair de um campo que já apresentou erro. */

            [
                nameInput,
                phoneInput,
                emailInput,
                couponInput
            ].forEach((input) => {
                input.addEventListener('blur', () => {
                    if (
                        submitAttempted &&
                        !errorElements[input.id].classList.contains('hidden')
                    ) {
                        validateSingleField(input);
                    }
                });
            });

            /* Envio do formulário e validação personalizada. */

            form.addEventListener('submit', (event) => {
                event.preventDefault();

                submitAttempted = true;
                clearAllErrors();

                const fields = [
                    nameInput,
                    phoneInput,
                    emailInput,
                    couponInput
                ];

                /* Interrompe no primeiro campo inválido. */

                for (const input of fields) {
                    if (!validateSingleField(input)) {
                        input.focus();
                        return;
                    }
                }

                /* Lógica de verificação do cupom e definição da mensagem final */
                
                const baseMessage = 'Fique de olho na sua caixa de entrada, acabamos de enviar as informações para o e-mail cadastrado.';
                
                if (couponInput.value.trim() !== '') {
                    const discountMessage = 'Você resgatou 20% de desconto nesse curso! ' + baseMessage;
                    successMessageText.textContent = discountMessage;
                    successStatus.textContent = discountMessage;
                } else {
                    successMessageText.textContent = baseMessage;
                    successStatus.textContent = baseMessage;
                }

                /* Exibe a tela de confirmação. */

                form.classList.add('hidden');
                form.setAttribute('aria-hidden', 'true');

                successState.classList.remove('hidden');
                successState.setAttribute('aria-hidden', 'false');

                regCard.classList.add('success-glow');

                btnBack.focus();
            });

            /* Volta ao formulário e limpa os campos e avisos. */

            btnBack.addEventListener('click', () => {
                successState.classList.add('hidden');
                successState.setAttribute('aria-hidden', 'true');

                successStatus.textContent = '';

                form.classList.remove('hidden');
                form.setAttribute('aria-hidden', 'false');

                regCard.classList.remove('success-glow');

                form.reset();
                submitAttempted = false;
                clearAllErrors();

                nameInput.focus();
            });

        });
    </script>

</body>
</html>
